<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/privacy.css">
</head>
<body class="{{bodyClass}}" data-page="{{pageKey}}">
<a class="skip-link" href="#main-content">Skip to main content</a>
{{pageAssets}}


<!-- NAV -->
{{> partials/header}}
{{> partials/navigation}}
{{> partials/cookie-banner}}

<main id="main-content" tabindex="-1">
{{pageContent}}
{{quoteDisclosure}}
</main>
{{> partials/footer}}

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Gallery image" aria-hidden="true" inert>
  <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-nav lb-prev" type="button" aria-label="Previous image">&#8249;</button>
  <figure class="lb-stage">
    <img class="lb-img" alt="">
    <figcaption class="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-nav lb-next" type="button" aria-label="Next image">&#8250;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>


{{> partials/chat}}
{{pageScripts}}
<script type="module" src="/app.js"></script>
</body>
</html>
