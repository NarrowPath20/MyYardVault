<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body class="{{bodyClass}}" data-page="{{pageKey}}">
<div id="introVeil" aria-hidden="true"></div>
{{pageAssets}}
<div id="cursor-glow"></div>
<div id="vignette"></div>
<div id="grain"></div>

<!-- NAV -->
{{> partials/header}}
{{> partials/navigation}}

<main id="main-content">
{{pageContent}}
</main>
{{> partials/footer}}

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Gallery image" aria-hidden="true">
  <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-nav lb-prev" type="button" aria-label="Previous image">&#8249;</button>
  <figure class="lb-stage">
    <img class="lb-img" alt="">
    <figcaption class="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-nav lb-next" type="button" aria-label="Next image">&#8250;</button>
</div>

<div class="toast" id="toast"></div>

{{> partials/chat}}
{{pageScripts}}
<script type="module" src="/app.js"></script>
</body>
</html>
