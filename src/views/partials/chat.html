<!-- VAULT ASSISTANT -->
<button id="yvChatFab" type="button" aria-label="Chat with My Yard Vault 4 Corners" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
</button>
<div id="yvChat" hidden role="dialog" aria-label="Vault Assistant chat">
  <div class="yc-head">
    <span class="ava"><svg viewBox="0 0 48 48" fill="none"><path d="M24 8 L40 17 L24 26 L8 17 Z" fill="#fff" opacity=".95"/><path d="M8 17 L24 26 L24 42 L8 33 Z" fill="#fff" opacity=".55"/><path d="M24 26 L40 17 L40 33 L24 42 Z" fill="#fff" opacity=".75"/></svg></span>
    <div><b>Vault Assistant</b><small>Automated product guide</small></div>
    <button class="yc-close" type="button" aria-label="Close chat">&times;</button>
  </div>
  <p class="chat-notice">Answers run in your browser. Contact details are sent only when you choose to send a request. <a href="/privacy">Privacy policy</a>.</p>
  <div class="yc-msgs" id="ycMsgs" role="log" aria-live="polite" aria-label="Conversation"></div>
  <fieldset class="consent-group chat-consent">
    <legend>Required only when requesting contact</legend>
    <label class="consent-check"><input type="checkbox" id="chatAdult"><span>I am 18 or older and am not sharing a child's information.</span></label>
    <label class="consent-check"><input type="checkbox" id="chatConsent"><span>I authorize a response to my request using the details I provide. No marketing subscription.</span></label>
  </fieldset>
  <form class="yc-inrow" id="ycForm">
    <input id="ycInput" type="text" placeholder="Ask about sizes, pricing, delivery&hellip;" autocomplete="off" aria-label="Message">
    <button class="yc-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
  </form>
</div>
