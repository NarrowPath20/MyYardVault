name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare README-only site
        run: |
          mkdir -p pages-source
          printf '%s\n' '---' 'layout: default' 'title: My Yard Vault 4 Corners' '---' > pages-source/index.md
          cat README.md >> pages-source/index.md
          printf '%s\n' 'theme: jekyll-theme-primer' > pages-source/_config.yml
      - name: Render README
        uses: actions/jekyll-build-pages@v1
        with:
          source: pages-source
          destination: pages-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
